[package]
name = "ma-irc"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "IRC-focused ma runtime prototype with native root and channel actors"

[dependencies]
anyhow = "1"
ciborium = "0.2"
clap = { version = "4", features = ["derive"] }
ma-core = { version = "^0.15", default-features = false, features = ["acl", "config", "kubo", "iroh"] }
nanoid = "0.5"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "query"] }
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "signal"] }
tokio-rustls = "0.26"
tracing = "0.1"
url = "2"
webpki-roots = "1"
zeroize = "1"

[dev-dependencies]
pretty_assertions = "1"
